<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saved Addresses</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- External CSS -->
    <link rel="stylesheet" href="address.css" />
</head>

<body>

    <div class="mobile-container">
        <!-- Top Header -->
        <header class="top-bar">
            <i class="fa-solid fa-chevron-left back-btn"></i>
            <h2>Address</h2>
        </header>

        <!-- Main Content -->
        <main class="content">
            <!-- Register / Add New Address Button -->
            <button class="register-btn" type="button">
                <i class="fa-solid fa-plus"></i> Register now
            </button>

            <!-- Section Subheading -->
            <h3 class="section-title">Default Address</h3>

            <!-- Address Card -->
            <div class="address-card">
                <div class="card-header">
                    <span class="user-name">Tushar</span>
                    <span class="tag">OFFICE</span>
                </div>

                <p class="address-line">Near Hari Om Circle</p>
                <p class="address-line">Opp. Bus Stand</p>
                <p class="address-line">Yamuna Nagar - 135001</p>
                <p class="address-line">Haryana</p>
                <p class="phone-line">Mobile: <span>0123456789</span></p>

                <!-- Actions: Remove & Edit -->
                <div class="card-actions">
                    <button type="button" class="btn-remove">Remove</button>
                    <button type="button" class="btn-edit">Edit</button>
                </div>
            </div>
        </main>

        <!-- Bottom Action Button -->
        <footer class="bottom-wrapper">
            <button type="button" class="save-btn">Save</button>
        </footer>
    </div>

</body>

</html>
