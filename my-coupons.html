<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Coupons</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- External CSS -->
    <link rel="stylesheet" href="my-coupons.css" />
</head>

<body>

    <div class="mobile-container">
        <!-- Top Header -->
        <header class="top-bar">
            <i class="fa-solid fa-chevron-left back-btn"></i>
            <h2>My Coupons</h2>
        </header>

        <!-- Content Area -->
        <main class="content">

            <!-- Coupon Cards List -->
            <div class="coupon-list">
                <!-- Coupon 1 -->
                <div class="coupon-card">
                    <div class="coupon-left">
                        <span class="discount-percent">20%</span>
                        <span class="discount-label">Off</span>
                    </div>
                    <div class="dashed-divider"></div>
                    <div class="coupon-right">
                        <h4 class="category-name">Home Decor</h4>
                        <p class="coupon-desc">On minimum purchase of Rs. 1,999</p>
                    </div>
                </div>

                <!-- Coupon 2 -->
                <div class="coupon-card">
                    <div class="coupon-left">
                        <span class="discount-percent">50%</span>
                        <span class="discount-label">Off</span>
                    </div>
                    <div class="dashed-divider"></div>
                    <div class="coupon-right">
                        <h4 class="category-name">Home Furnishing</h4>
                        <p class="coupon-desc">On minimum purchase of Rs. 3,999</p>
                    </div>
                </div>

                <!-- Coupon 3 -->
                <div class="coupon-card">
                    <div class="coupon-left">
                        <span class="discount-percent">25%</span>
                        <span class="discount-label">Off</span>
                    </div>
                    <div class="dashed-divider"></div>
                    <div class="coupon-right">
                        <h4 class="category-name">Home Decor</h4>
                        <p class="coupon-desc">On minimum purchase of Rs. 999</p>
                    </div>
                </div>
            </div>

            <!-- Banner Section -->
            <section class="banner-section">
                <h3 class="section-title">Discount on your sale</h3>

                <!-- Horizontal Scrollable Banners -->
                <div class="banner-slider">
                    <div class="banner-card">

                        <img src="image/image 5.png" alt="Discount Banner" class="banner-img" />
                    </div>
                    <div class="banner-card">
                        <!-- Second banner placeholder -->
                        <img src="" alt="Discount Banner 2" class="banner-img" />
                    </div>
                </div>
            </section>

        </main>
    </div>

</body>

</html>
