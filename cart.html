<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <i class="fa-solid fa-chevron-left back-btn" onclick="history.back()"></i>
    <!-- External CSS -->
    <link rel="stylesheet" href="cart.css" />
</head>

<body>

    <div class="mobile-container">
        <!-- Top Header -->
        <header class="top-bar">
            <i class="fa-solid fa-chevron-left back-btn"></i>
            <h2>Cart</h2>
            <i class="fa-solid fa-ellipsis-vertical menu-btn"></i>
        </header>

        <!-- Scrollable Content -->
        <main class="content">

            <!-- Cart Items List -->
            <section class="cart-items">

                <!-- Item 1 -->
                <article class="cart-item">
                    <div class="item-img-box">

                        <img src="image/cb2c4342d00e7feb904aafccd39e49d6093cbe46.png" alt="F1 Bomber Jacket" class="item-img" />
                    </div>
                    <div class="item-details">
                        <h3 class="item-title">F1 Vintage Racing Varsity Bomber Jacket</h3>
                        <span class="item-sub">Jacket</span>
                        <div class="price-row">
                            <span class="current-price">₹1,499</span>
                            <span class="old-price">₹2,499</span>
                        </div>
                    </div>
                    <div class="quantity-controller">
                        <button class="qty-btn" type="button">-</button>
                        <span class="qty-val">01</span>
                        <button class="qty-btn" type="button">+</button>
                    </div>
                </article>

                <!-- Item 2 -->
                <article class="cart-item">
                    <div class="item-img-box">

                        <img src="image/687fee7600c07ecb2e3e266956a2fae740f07389.png" alt="Kurta Set" class="item-img" />
                    </div>
                    <div class="item-details">
                        <h3 class="item-title">Women's Embroidered Anarkali Kurta Set</h3>
                        <span class="item-sub">Kurta Set</span>
                        <div class="price-row">
                            <span class="current-price">₹1,899</span>
                            <span class="old-price">₹2,999</span>
                        </div>
                    </div>
                    <div class="quantity-controller">
                        <button class="qty-btn" type="button">-</button>
                        <span class="qty-val">01</span>
                        <button class="qty-btn" type="button">+</button>
                    </div>
                </article>

                <!-- Item 3 -->
                <article class="cart-item">
                    <div class="item-img-box">

                        <img src="image/1a32609385dae9dfd55d7668174870a70145502f.png" alt="Korean Style Coat" class="item-img" />
                    </div>
                    <div class="item-details">
                        <h3 class="item-title">Women's Oversized Korean Style Coat</h3>
                        <span class="item-sub">Coat</span>
                        <div class="price-row">
                            <span class="current-price">₹499</span>
                            <span class="old-price">₹1,199</span>
                        </div>
                    </div>
                    <div class="quantity-controller">
                        <button class="qty-btn" type="button">-</button>
                        <span class="qty-val">01</span>
                        <button class="qty-btn" type="button">+</button>
                    </div>
                </article>

            </section>

            <!-- Coupon / Promo Input -->
            <section class="coupon-section">
                <label class="coupon-label">Have a Coupon code? enter here</label>
                <div class="coupon-box">
                    <div class="coupon-input-wrap">
                        <i class="fa-solid fa-ticket coupon-icon"></i>
                        <input type="text" placeholder="Enter Your Offer Code" />
                    </div>
                    <i class="fa-solid fa-chevron-right coupon-arrow"></i>
                </div>
            </section>

            <!-- Order Summary Bill -->
            <section class="bill-details">
                <div class="bill-row">
                    <span>Price</span>
                    <span>₹1,899</span>
                </div>
                <div class="bill-row">
                    <span>Tax</span>
                    <span>0.5%</span>
                </div>
                <div class="bill-row">
                    <span>Delivery Fee</span>
                    <span>0.8%</span>
                </div>
                <div class="bill-divider"></div>
                <div class="bill-row total-row">
                    <span>Total</span>
                    <span class="total-amt">₹2,899</span>
                </div>
            </section>

        </main>

        <!-- Checkout Footer Bar -->
        <footer class="cart-footer">
            <div class="checkout-total">
                <span class="final-amt">₹3,897</span>
                <a href="#" class="view-price-link">View price details</a>
            </div>
            <button type="button" class="checkout-btn">Checkout</button>
        </footer>
    </div>

</body>

</html>
