<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- External CSS -->
    <link rel="stylesheet" href="profile-menu.css" />
</head>

<body>

    <div class="mobile-container">
        <!-- Top Header -->
        <header class="top-bar">
            <i class="fa-solid fa-chevron-left back-btn"></i>
            <h2>Edit Profile</h2>
        </header>

        <!-- Form Section -->
        <form class="form-container">
            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" value="0123456789" placeholder="Enter mobile number" />
            </div>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" value="Thomas Djono" placeholder="Enter full name" />
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" value="Thomas@gmail.com" placeholder="Enter email" />
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" value="LH-12, East Wally USA" placeholder="Enter location" />
            </div>

            <!-- Save Button -->
            <div class="button-wrapper">
                <button type="submit" class="save-btn">Save</button>
            </div>
        </form>
    </div>

</body>

</html>
