<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Categories</title>
    <link rel="stylesheet" href="categories.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="mobile-container">
        <!-- Header -->
        <header class="header">
            <button class="icon-btn"><i class="fa-solid fa-chevron-left"></i></button>
            <h2>All Categories</h2>
            <button class="icon-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </header>

        <!-- Categories List -->
        <div class="categories-list">

            <!-- Men T-shirt Card -->
            <div class="category-card card-yellow">
                <div class="card-content">
                    <h3>Men T-shirt</h3>
                    <p>240 Items</p>
                    <a href="#" class="shop-btn">Shop Now</a>
                </div>
                <div class="card-image">
                    <img src="image/shopping-removebg-preview 1.png" alt="Men T-shirt">
                </div>
            </div>

            <!-- Jackets Card -->
            <div class="category-card card-pink">
                <div class="card-content">
                    <h3>Jackets</h3>
                    <p>140 Items</p>
                    <a href="#" class="shop-btn">Shop Now</a>
                </div>
                <div class="card-image">
                    <img src="image/shopping__1_-removebg-preview 1.png" alt="Jackets">
                </div>
            </div>

            <!-- Shoes Card -->
            <div class="category-card card-white">
                <div class="card-content">
                    <h3>Shoes</h3>
                    <p>104 Items</p>
                    <a href="#" class="shop-btn">Shop Now</a>
                </div>
                <div class="card-image">
                    <img src="image/Sc490c0e8d2c446fb9d0e61821f5d8818K-removebg-preview 1.png" alt="Shoes">
                </div>
            </div>

            <!-- Sunglasses Card -->
            <div class="category-card card-cyan">
                <div class="card-content">
                    <h3>Sunglasses</h3>
                    <p>100 Items</p>
                    <a href="#" class="shop-btn">Shop Now</a>
                </div>
                <div class="card-image">
                    <img src="image/images-removebg-preview (2) 1 (1).png" alt="Sunglasses">
                </div>
            </div>

            <!-- Watch's Card -->
            <div class="category-card card-gold">
                <div class="card-content">
                    <h3>Watch's</h3>
                    <p>80 Items</p>
                    <a href="#" class="shop-btn">Shop Now</a>
                </div>
                <div class="card-image">
                    <img src="image/Pulse-removebg-preview (1) 1.png" alt="Watch's">
                </div>
            </div>

        </div>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="#" class="nav-item active">
                <i class="fa-solid fa-table-cells-large"></i>
                <span>Categories</span>
            </a>
            <div class="floating-btn-wrapper">
                <button class="floating-center-btn">
                    <i class="fa-solid fa-bag-shopping"></i>
                </button>
            </div>
            <a href="#" class="nav-item">
                <i class="fa-regular fa-heart"></i>
                <span>Wishlist</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-regular fa-user"></i>
                <span>Profile</span>
            </a>
        </nav>
    </div>

</body>

</html>
